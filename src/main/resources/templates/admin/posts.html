<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/site :: head}"></head>
  <body class="desk">
    <header th:replace="~{fragments/desk :: top}"></header>
    <nav th:replace="~{fragments/desk :: deskNavigation}"></nav>
    <main id="main" class="wrap desk-main">
      <div th:replace="~{fragments/site :: alerts}"></div>
      <div class="section-head">
        <h1>
          Manage posts
          <span>.</span>
        </h1>
        <a href="/admin/posts/new" class="button">+ New post</a>
      </div>
      <form method="get" action="/admin/posts" class="filter-bar">
        <label>
          Search posts
          <input type="search" name="q" th:value="${q}" maxlength="160" />
        </label>
        <label>
          Visibility
          <select name="state">
            <option value="all">All posts</option>
            <option value="published" th:selected="${state=='published'}">Published</option>
            <option value="draft" th:selected="${state=='draft'}">Drafts</option>
          </select>
        </label>
        <button class="button">Filter</button>
      </form>
      <section class="panel">
        <p th:if="${results.empty}">No posts match this view.</p>
        <div class="post-manage" th:each="s : ${results.content}">
          <div>
            <small class="category" th:text="${s.category.name}"></small>
            <h2><a th:href="@{/admin/posts/{id}/edit(id=${s.id})}" th:text="${s.title}"></a></h2>
            <span class="badge" th:text="${s.published ? 'Published' : 'Draft'}"></span>
            <span class="badge warm" th:if="${s.featured}">Featured</span>
          </div>
          <div class="row-actions">
            <a class="button secondary small" th:href="@{/admin/posts/{id}/edit(id=${s.id})}">Edit</a>
            <a class="text-link" th:if="${s.published}" th:href="${s.url}">View ↗</a>
            <form method="post" th:action="@{/admin/posts/{id}/action(id=${s.id})}">
              <input type="hidden" name="version" th:value="${s.version}" />
              <button
                class="plain"
                name="action"
                th:value="${s.published ? 'unpublish' : 'publish'}"
                th:text="${s.published ? 'Unpublish' : 'Publish'}"></button>
              <button
                class="plain"
                name="action"
                th:value="${s.featured ? 'unpin' : 'pin'}"
                th:text="${s.featured ? 'Unpin' : 'Pin'}"></button>
              <button
                class="plain danger"
                name="action"
                value="delete"
                data-confirm="Delete this post permanently?">
                Delete
              </button>
            </form>
          </div>
        </div>
      </section>
      <nav th:replace="~{fragments/desk :: pager('/admin/posts')}"></nav>
    </main>
  </body>
</html>
