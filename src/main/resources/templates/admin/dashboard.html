<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/site :: head}"></head>
  <body class="desk">
    <header th:replace="~{fragments/desk :: top}"></header>
    <nav th:replace="~{fragments/desk :: deskNavigation}"></nav>
    <main id="main" class="wrap desk-main">
      <div th:replace="~{fragments/site :: alerts}"></div>
      <div class="section-head">
        <h1>
          Editorial desk
          <span>.</span>
        </h1>
        <a href="/admin/posts/new" class="button">+ New post</a>
      </div>
      <div class="stat-grid">
        <a href="/admin/posts?state=published">
          <small>Published posts</small>
          <b th:text="${published}"></b>
        </a>
        <a href="/admin/posts?state=draft">
          <small>Drafts</small>
          <b th:text="${drafts}"></b>
        </a>
        <a href="/admin/messages">
          <small>Total messages</small>
          <b th:text="${messages}"></b>
        </a>
        <a href="/admin/messages">
          <small>Unread inbox</small>
          <b th:text="${unread}"></b>
        </a>
      </div>
      <div class="contact-layout">
        <section class="panel">
          <div class="section-head">
            <h2>Recent posts</h2>
            <a class="text-link" href="/admin/posts">Manage all →</a>
          </div>
          <a class="manage-row" th:each="s : ${recent}" th:href="@{/admin/posts/{id}/edit(id=${s.id})}">
            <span th:text="${s.title}"></span>
            <small class="badge" th:text="${s.published ? 'Published' : 'Draft'}"></small>
          </a>
          <p th:if="${recent.empty}">No posts yet.</p>
        </section>
        <section class="panel">
          <h2>Recent activity</h2>
          <p th:if="${activity.empty}">Editorial activity will appear here.</p>
          <div class="activity" th:each="a : ${activity}">
            <b th:text="${a.summary}"></b>
            <small th:text="${a.actor + ' · ' + @dates.stamp(a.time)}"></small>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
