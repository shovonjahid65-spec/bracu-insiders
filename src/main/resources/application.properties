spring.application.name=BRACU Insiders
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/insiders}
spring.datasource.username=${DB_USER:insiders}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=32
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=26MB
server.tomcat.max-parameter-count=120
server.tomcat.max-part-count=32
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
spring.thymeleaf.cache=true
app.bootstrap.username=${ADMIN_USERNAME:}
app.bootstrap.password=${ADMIN_PASSWORD:}
app.seed-edition=${SEED_EDITION:true}
spring.web.locale=en
spring.web.locale-resolver=fixed
server.forward-headers-strategy=${FORWARDED_HEADERS:none}
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_REGEX:127[.]0[.]0[.]1}
